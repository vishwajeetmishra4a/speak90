<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

        rel="stylesheet"
    >

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

</head>
<body>

    <!-- <h1 id="topicTitle">Loading...</h1> -->

    <nav class="navbar">

        <div class="logo">
            SPEAK90
        </div>
        <div class="creator-badge">
        <b>Made by</b>
        <a href="https://instagram.com/the.vishverse/"
            target="_blank"
            class="instagram-btn"
        >
            <i class="fa-brands fa-instagram"></i>
           <i>@the.vishverse</i>
        </a>
    </div>

    <ul class="nav-links">
            <li><a>Home</a></li>
            <li><a>Explore More</a></li>
    </ul>

    </nav>

    <!-- Sticky Topic Banner -->

<section class="topic-banner">

    <h2 id="globalTopic"></h2>

</section>

    <section id="prepareSection">

        <!-- <h1 id="topicTitle"></h1>
        <br>
         -->
        <h2>Select Preparation Time</h2>
<!-- 
        <select id="prepTimeSelect">

            <option value="1">1 Minute</option>
            <option value="2">2 Minutes</option>
            <option value="3">3 Minutes</option>
            <option value="5">5 Minutes</option>
            <option value="10">10 Minutes</option>

        </select> -->

    <div class="time-buttons">

        <button class="time-btn active" data-time="1">
            1 Min
        </button>

        <button class="time-btn" data-time="2">
            2 Min
        </button>

        <button class="time-btn" data-time="3">
            3 Min
        </button>

        <button class="time-btn" data-time="5">
            5 Min
        </button>

        <button class="time-btn" data-time="10">
            10 Min
        </button>

    </div>

    <button
        id="startPrepBtn"
        class="primary-btn">
        Start Preparation
    </button>

    </section>

    <!-- PREPARATION TIMER -->

<section id="timerSection" class="hidden">

    <h2>Preparation Time Remaining</h2>

    <div class="progress-container">

        <svg class="progress-ring" width="220" height="220">

            <circle
                class="progress-bg"
                cx="110"
                cy="110"
                r="90">
            </circle>

            <circle
                id="prepCircle"
                class="progress-ring-circle"
                cx="110"
                cy="110"
                r="90">
            </circle>

        </svg>

        <div id="prepTimerDisplay" class="timer-text">
            00:00
        </div>

    </div>

    <button id="speakNowBtn" class="primary-btn">
        Speak Now
    </button>

</section>


<!-- COUNTDOWN SECTION -->

<section id="countdownSection" class="hidden">

    <h2 id="countdownTitle">
        Speech Starts In
    </h2>

    <div class="progress-container">

        <svg class="progress-ring" width="220" height="220">

            <circle
                class="progress-bg"
                cx="110"
                cy="110"
                r="90">
            </circle>

            <circle
                id="countdownCircle"
                class="progress-ring-circle"
                cx="110"
                cy="110"
                r="90">
            </circle>

        </svg>

        <div id="countdownDisplay" class="timer-text">
            10
        </div>

    </div>

</section>


<!-- SPEAKING SECTION -->

<section id="speechSection" class="hidden">

    <h2 id="speechTopic"></h2>

    <div class="progress-container">

        <svg class="progress-ring" width="220" height="220">

            <circle
                class="progress-bg"
                cx="110"
                cy="110"
                r="90">
            </circle>

            <circle
                id="speechCircle"
                class="progress-ring-circle"
                cx="110"
                cy="110"
                r="90">
            </circle>

        </svg>

        <div id="speechTimer" class="timer-text">
            90
        </div>

    </div>

    <h3 id="speechStage">
        Origin & Introduction
    </h3>

</section>


<!-- COMPLETION -->

<section id="completeSection" class="hidden">

    <h1>🎉 Session Completed</h1>

    ../../index.html
        Try Another Topic
    </button>

</section>

<button onclick="location.reload()" class="primary-btn">
        Try Another Topic
    </button>

     <!-- Footer -->
    <footer class="footer">

        <div class="footer-content">
            <p class="footer-copy">
               <b> © 2026 Speak90. All Rights Reserved.</b>
            </p>
        </div>

    </footer>


    <!-- JavaScript -->
    <script src="../js/prepare.js"></script>

</body>
</html>
