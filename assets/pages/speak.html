            SPEAK90

        <div class="creator-badge">
        <b>Made by</b>
        <a href="https://instagram.com/the.vishverse/"

    <!-- Sticky Topic Banner -->

<section class="topic-banner">

    <h2 id="globalTopic"></h2>

</section>

<!-- DIRECT COUNTDOWN -->

<section id="countdownSection">

    <h2>Get Ready To Speak</h2>

    <div class="progress-container">

        <svg class="progress-ring" width="220" height="220">

            <circle
                class="progress-bg"
                cx="110"
                cy="110"
                r="90">
            </circle>

            <circle
                id="countdownCircle"
                class="progress-ring-circle"
                cx="110"
                cy="110"
                r="90">
            </circle>

        </svg>

        <div id="countdownDisplay" class="timer-text">
            5
        </div>

    </div>

    <div class="countdown-actions">

        <button
            id="addFiveBtn"
            class="secondary-btn">

            +5 Seconds

        </button>

    </div>

</section>


<!-- SPEECH SECTION -->

<section id="speechSection" class="hidden">

    <h2 class="speech-title">
        Start Speaking
    </h2>

    <div class="progress-container">

        <svg class="progress-ring" width="220" height="220">

            <circle
                class="progress-bg"
                cx="110"
                cy="110"
                r="90">
            </circle>

            <circle
                id="speechCircle"
                class="progress-ring-circle"
                cx="110"
                cy="110"
                r="90">
            </circle>

        </svg>

        <div id="speechTimer" class="timer-text">
            90
        </div>

    </div>

    <h3 id="speechStage">
        Origin & Introduction
    </h3>

</section>


<!-- COMPLETION -->

<section id="completeSection" class="hidden">

    <h1>🎉 Session Completed</h1>

    ../../index.html

</body>
</html>
