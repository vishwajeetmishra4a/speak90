<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speak90</title>

    <link rel="stylesheet" href="./assets/css/style.css"> 

    <link
        href="https://fonts.googleapispins:wght@300;400;500;600;700&display=swap
</head>

<body>

    <nav class="navbar">
        <div class="logo">Speak90</div>

        <ul class="nav-links">
            <li>#Home</a></li>
            <li>#Explore More</a></li>
        </ul>
    </nav>

    <section class="hero">

        <h1>Think. Prepare. Speak.</h1>

        <p>
            Improve your communication skills through
            structured impromptu speaking practice.
        </p>

        <button id="findTopicBtn" class="primary-btn">
            Find A Topic
        </button>

    </section>

    <section class="topic-section">

        <div id="shuffleBox" class="shuffle-box">
            Click "Find A Topic"
        </div>

        <div id="actionButtons" class="action-buttons hidden">

            <button id="prepareBtn" class="secondary-btn">
                Prepare for this Topic
            </button>

            <button id="speakBtn" class="primary-btn">
                Speak on this Topic
            </button>

        </div>

    </section>

    <script src="./assets/js/topic.js"></script>
    <script src="./assets/js/app.js"></script>

</body>
</html>
