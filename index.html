<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speak90</title>

    <!-- CSS -->
    <link rel="stylesheet" href="./assets/css/fstyle.css">

    <!-- Google Font -->
    <link href="fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
</head>

<body>
    <!-- Navbar -->
     <br>
    <nav class="navbar">

        <div class="logo">
            SPEAK90
        </div>
    <div class="creator-badge">
        <span>Made by</span>
        <a href="https://instagram.com/the.vishverse/"
            target="_blank"
            class="instagram-btn"
        >
            <i class="fa-brands fa-instagram"></i>
            <i>@the.vishverse</i>
        </a>
    </div>

        <ul class="nav-links">
            <li><a href="./index.html">Home</a></li>
            <li><a href="./explore.html">Explore More</a></li>
        </ul>

    </nav>

    <!-- Hero Section -->
    <section class="hero">

        <h1>Think. Prepare. Speak.</h1>

        <p>
            Improve your communication skills through
            structured impromptu speaking practice.
        </p>

        <button id="findTopicBtn" class="primary-btn">
            Find A Topic
        </button>

    </section>

    <!-- Topic Section -->
    <section class="topic-section">

        <div id="shuffleBox" class="shuffle-box">
            Click "Find A Topic"
        </div>

        <div id="actionButtons" class="action-buttons hidden">

            <!-- <button id="prepareBtn" class="secondary-btn" >
                Prepare for this Topic
            </button>

            <button id="speakBtn" class="primary-btn">
                Speak on this Topic
            </button> -->

    <button id="prepareBtn" class="secondary-btn" disabled>

        Prepare for this Topic

    </button>

    <button id="speakBtn" class="primary-btn" disabled>

        Speak on this Topic

    </button>

        </div>

    </section>

    <!-- Preparation Screen -->

<section id="prepareSection" class="hidden">

    <h2>Preparation Time</h2>

    <select id="prepTimeSelect">
        <option value="1">1 Minute</option>
        <option value="2">2 Minutes</option>
        <option value="3">3 Minutes</option>
        <option value="5">5 Minutes</option>
        <option value="10">10 Minutes</option>
    </select>

    <button id="startPrepBtn" class="primary-btn">
        Start Preparation
    </button>

</section>

<!-- Timer Screen -->

<section id="timerSection" class="hidden">

    <h2 id="timerTitle">Preparation Time</h2>

    <div class="progress-container">

        <svg class="progress-ring" width="220" height="220">

            <circle
                class="progress-bg"
                cx="110"
                cy="110"
                r="90">
            </circle>

            <circle
                id="progressCircle"
                class="progress-ring-circle"
                cx="110"
                cy="110"
                r="90">
            </circle>

        </svg>

        <div id="timerDisplay" class="timer-text">
            00:00
        </div>

    </div>

    <button id="speakNowBtn" class="primary-btn">
        Speak Now
    </button>

</section>

<!-- Speaking Screen -->

<section id="speechSection" class="hidden">

    <h2 id="speechTopic"></h2>

    <div class="progress-container">

        <svg class="progress-ring" width="220" height="220">

            <circle
                class="progress-bg"
                cx="110"
                cy="110"
                r="90">
            </circle>

            <circle
                id="speechCircle"
                class="progress-ring-circle"
                cx="110"
                cy="110"
                r="90">
            </circle>

        </svg>

        <div id="speechTimer" class="timer-text">
            90
        </div>

    </div>

    <h3 id="speechStage">
        Origin & Introduction
    </h3>

</section> 

<!-- Completion Screen -->

<section id="completeSection" class="hidden">

    <h1>🎉 Session Completed</h1>

</section> 

    <!-- Footer -->
<!-- <footer class="footer">

    <div class="footer-content">
        <p class="footer-copy">
           <b>© 2026 Speak90. All Rights Reserved.</b>
        </p>
    </div>

</footer> -->

    <!-- JavaScript -->
<script src="./assets/js/topic.js"></script>
    <script src="./assets/js/app.js"></script>

</body>
</html>
