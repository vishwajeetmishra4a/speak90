<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speak90</title>

    <!-- CSS -->
    <link rel="stylesheet" href="./assets/css/style.css">

    <!-- Google Font -->
    <link href="fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >
</head>

<body>

    <!-- Navbar -->
     <br>
    <nav class="navbar">

        <div class="logo">
            SPEAK90
        </div>

        <ul class="nav-links">
            <li><a>Home</a></li>
            <li><a>Explore More</a></li>
        </ul>

    </nav>

    <!-- Hero Section -->
    <section class="hero">

        <h1>Think. Prepare. Speak.</h1>

        <p>
            Improve your communication skills through
            structured impromptu speaking practice.
        </p>

        <button id="findTopicBtn" class="primary-btn">
            Find A Topic
        </button>

    </section>

    <!-- Topic Section -->
    <section class="topic-section">

        <div id="shuffleBox" class="shuffle-box">
            Click "Find A Topic"
        </div>

        <div id="actionButtons" class="action-buttons hidden">

            <button id="prepareBtn" class="secondary-btn">
                Prepare for this Topic
            </button>

            <button id="speakBtn" class="primary-btn">
                Speak on this Topic
            </button>

        </div>

    </section>

    <!-- Footer -->
<footer class="footer">

    <div class="footer-content">

        <div class="footer-logo">
            SPEAK90
        </div>

        <p class="footer-text">
            Think. Prepare. Speak.
        </p>
        <p class="footer-copy">
            © 2026 Speak90. All Rights Reserved.
        </p>

    </div>

</footer>

    <!-- JavaScript -->
<script src="./assets/js/topic.js"></script>
